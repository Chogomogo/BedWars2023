name: Heavy CI - GitHub Hosted

on:
  workflow_dispatch:

jobs:
  heavy-ci:
    name: Build + Deploy + Javadoc (GitHub Hosted)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ubuntu-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ubuntu-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: release-candidate

      - name: Full Build (GitHub-hosted)
        run: |
          ./gradlew clean build publishToMavenLocal javadoc --stacktrace
