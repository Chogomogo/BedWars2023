name: Heavy CI - GitHub Hosted

on:
  workflow_dispatch:

jobs:
  heavy-ci:
    name: Build + Deploy + Javadoc (GitHub Hosted)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install unzip, Gradle, and latest Java
        run: |
          sudo apt update
          sudo apt install unzip wget tar -y

          # Install Gradle 8.4
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -P /tmp
          sudo unzip -d /opt/gradle /tmp/gradle-8.4-bin.zip
          echo 'export PATH=$PATH:/opt/gradle/gradle-8.4/bin' >> $GITHUB_ENV

          # Install latest Java (Temurin JDK 22)
          wget https://github.com/adoptium/temurin22-binaries/releases/latest/download/OpenJDK22U-jdk_x64_linux_hotspot.tar.gz -P /tmp
          sudo mkdir -p /opt/java/latest
          sudo tar -xzf /tmp/OpenJDK22U-jdk_x64_linux_hotspot.tar.gz -C /opt/java/latest --strip-components=1
          echo 'JAVA_HOME=/opt/java/latest' >> $GITHUB_ENV
          echo 'PATH=$JAVA_HOME/bin:$PATH' >> $GITHUB_ENV

      - name: Set up JDK 21 for compatibility
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ubuntu-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ubuntu-gradle-

      - name: Run full build
        run: |
          java -version
          gradle clean build publishToMavenLocal javadoc --stacktrace
